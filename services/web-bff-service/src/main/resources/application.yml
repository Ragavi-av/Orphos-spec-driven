server:
  port: 8098

spring:
  application:
    name: web-bff-service

# This service holds no state — no ArcadeDB, no schema bootstrap. It is a pure
# read-through aggregator, so a restart loses nothing and it scales horizontally.
eip:
  web-bff:
    downstream:
      platform-registry:  ${PLATFORM_REGISTRY_URL:http://eip-platform-registry:8093}
      platform-core:      ${PLATFORM_CORE_URL:http://eip-platform-core:8090}
      briefing:           ${BRIEFING_URL:http://eip-briefing:8084}
      priority-engine:    ${PRIORITY_ENGINE_URL:http://eip-priority-engine:8083}
      decision-log:       ${DECISION_LOG_URL:http://eip-decision-log:8086}
      notification:       ${NOTIFICATION_URL:http://eip-notification:8087}
      doc-ingest:         ${DOC_INGEST_URL:http://eip-doc-ingest:8091}
      widgets:            ${WIDGETS_URL:http://eip-widgets:8095}
    fan-out:
      pool-size:      ${WEB_BFF_FANOUT_POOL_SIZE:16}
      queue-capacity: ${WEB_BFF_FANOUT_QUEUE_CAPACITY:128}
      timeout:        ${WEB_BFF_FANOUT_TIMEOUT:PT8S}

  # Read timeout is per downstream call and must stay below the fan-out budget above,
  # so a stuck downstream is cut loose by its own timeout rather than parked until the
  # batch deadline.
  http:
    connect-timeout: PT3S
    read-timeout: PT6S

  security:
    # Multi-issuer JWT (realm-per-tenant) is resolved by eip-common's
    # MultiIssuerJwtAutoConfiguration using tenant-discovery + allowed-issuers.
    tenant-discovery:
      url: ${EIP_TENANT_DISCOVERY_URL:http://eip-platform-core:8090}
      service-token: ${EIP_SECURITY_TENANT_DISCOVERY_SERVICE_TOKEN:${EIP_SECURITY_INTERNAL_SERVICE_TOKEN:}}
      cache-ttl: PT60S
    internal-issuer-base: ${KEYCLOAK_INTERNAL_BASE:http://eip-keycloak:8080}
    allowed-issuers:
      - ${KEYCLOAK_ISSUER_URI:http://${EIP_PUBLIC_HOST:localhost}:8443/realms/${KEYCLOAK_REALM:eip}}
      - ${EIP_SECURITY_PLATFORM_ISSUER:http://${EIP_PUBLIC_HOST:localhost}:8443/realms/platform}
    internal-service-token: ${EIP_SECURITY_INTERNAL_SERVICE_TOKEN:}

secrets:
  host:               ${INFISICAL_HOST:http://eip-infisical:8080}
  project-id:         ${INFISICAL_PROJECT_ID:}
  project-id-file:    ${INFISICAL_PROJECT_ID_FILE:}
  environment:        ${INFISICAL_ENV:prod}
  client-id:          ${INFISICAL_CLIENT_ID:}
  client-id-file:     ${INFISICAL_CLIENT_ID_FILE:}
  client-secret-file: ${INFISICAL_CLIENT_SECRET_FILE:}
  bindings:
    # Shared /api/internal token so tenant-issuer discovery authenticates against
    # platform-core. No other secret is needed: downstream calls ride the caller's
    # own bearer token, so this service owns no credential of its own.
    - EIP_SECURITY_TENANT_DISCOVERY_SERVICE_TOKEN=eip/internal-service#token
    - EIP_SECURITY_INTERNAL_SERVICE_TOKEN=eip/internal-service#token

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
