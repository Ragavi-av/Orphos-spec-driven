server:
  port: 8088

spring:
  application:
    name: okg-reasoning-service
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8443}/realms/${KEYCLOAK_REALM:eip}/protocol/openid-connect/certs

arcadedb:
  url: ${ARCADEDB_URL:http://eip-arcadedb:2480}
  user: ${ARCADEDB_USER:root}
  password: ${ARCADEDB_PASSWORD:}
  database: ${ARCADEDB_DB:orphos}

fuseki:
  base-url: ${FUSEKI_URL:http://eip-fuseki:3030}

reasoning:
  cycle-interval-ms: 900000        # 15 minutes
  cycle-initial-delay-ms: 90000
  ontology-path: classpath:eip-core.owl
  # The full base schema, unioned in this order. Required because RDF/XML parsing
  # into a plain Jena Model does NOT follow owl:imports — see OntologyService.
  # Every entry must exist or startup fails: a silently-dropped domain ontology
  # would silently drop the owl:hasValue classification axioms that persona RBAC
  # relies on. Keep in step with ontology/ (the files here are copies).
  #
  # zenitus.owl is deliberately EXCLUDED: it is one tenant's local TBox and that
  # tenant runs its own Fuseki dataset. The alignment axioms that connect its
  # terms to the shared model live in eip-hr/eip-finance/eip-strategy, so they
  # apply without loading the tenant file globally.
  #
  # TWO CORES, and they are NOT versions of each other:
  #   eip-core.owl        namespace .../core#  — external WORK ITEMS (Issue,
  #                       Project, Person, OverdueIssue...). What OntologyService.NS
  #                       points at and what overload-threshold below drives.
  #   eip-itops-core.owl  namespace .../eip#   — the IT ESTATE (Incident, ITSystem,
  #                       CostCentre, SLAMetric, BudgetItem, Alert). Copied from
  #                       ontology/eip-core.owl, renamed here so one filename never
  #                       means two ontologies. These are the classes that match the
  #                       ArcadeDB types actually holding tenant rows.
  # Both are loaded and both are classified by eip-itops.owl.
  ontology-paths: >-
    classpath:eip-core.owl,
    classpath:eip-itops-core.owl,
    classpath:eip-enterprise.owl,
    classpath:eip-governance.owl,
    classpath:eip-finance.owl,
    classpath:eip-hr.owl,
    classpath:eip-commercial.owl,
    classpath:eip-strategy.owl,
    classpath:eip-risk.owl,
    classpath:eip-itops.owl,
    classpath:eip-mobile.owl
  # More than this many open (non-"Done") issues assigned to one person marks
  # them eip:OverloadedPerson. Tune per tenant size once real usage data exists.
  overload-threshold: 5

secrets:
  host:        ${INFISICAL_HOST:http://eip-infisical:8080}
  project-id:         ${INFISICAL_PROJECT_ID:}
  project-id-file:    ${INFISICAL_PROJECT_ID_FILE:}
  environment: ${INFISICAL_ENV:prod}
  client-id:          ${INFISICAL_CLIENT_ID:}
  client-id-file:     ${INFISICAL_CLIENT_ID_FILE:}
  client-secret-file: ${INFISICAL_CLIENT_SECRET_FILE:}
  bindings:
    # OUTBOUND side of /api/internal/ shared secret — attached to every poll
    # against platform-core-service so its InternalServiceTokenFilter accepts the call.
    - EIP_SECURITY_TENANT_DISCOVERY_SERVICE_TOKEN=eip/internal-service#token
    # INBOUND side — lets this service's InternalServiceTokenAuthenticationFilter accept
    # internal callers (e.g. eip-mcp-reasoning) on the admin/run endpoint (same shared secret).
    - EIP_SECURITY_INTERNAL_SERVICE_TOKEN=eip/internal-service#token
    - ARCADEDB_PASSWORD=eip/arcadedb#password

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# Multi-issuer JWT validation. The trusted-issuer set is fetched from
# platform-core-service so a new tenant is accepted without restarting this service.
# spring.security.oauth2.resourceserver.jwt above is intentionally kept as
# backward-compatible dead weight — the AuthenticationManagerResolver in
# eip-common bypasses it.
eip:
  security:
    tenant-discovery:
      url: ${EIP_TENANT_DISCOVERY_URL:http://eip-platform-core:8090}
      service-token: ${EIP_SECURITY_TENANT_DISCOVERY_SERVICE_TOKEN:${EIP_SECURITY_INTERNAL_SERVICE_TOKEN:}}
      cache-ttl: PT60S
    platform-issuer: ${EIP_SECURITY_PLATFORM_ISSUER:http://localhost:8443/realms/platform}
    # The JWT iss claim is the browser-facing Keycloak URL, which isn't
    # reachable from inside Docker. Tell the validator to fetch JWKS from
    # the internal Keycloak hostname; iss-claim verification still uses the
    # original URL from the token.
    internal-issuer-base: ${KEYCLOAK_INTERNAL_BASE:http://eip-keycloak:8080}
    # Static fallback for cold-start (before the admin-poll has cached the
    # live tenant-realm list).
    allowed-issuers:
      - ${KEYCLOAK_ISSUER_URI:http://localhost:8443/realms/${KEYCLOAK_REALM:eip}}
