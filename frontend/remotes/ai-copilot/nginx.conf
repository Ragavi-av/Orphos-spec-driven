server {
    listen 80;
    root /usr/share/nginx/html;

    # This container only ever serves remoteEntry.js + its shared chunks �
    # the shell's own nginx proxies /remotes/ai-copilot/ here (see
    # frontend/shell/nginx.conf) so the browser's relative remoteEntryPath
    # (platform-registry-service's PluginManifest.remoteEntryPath) resolves
    # against the shell's own origin, not this container's.
    # remoteEntry.js is the federation entry point and has a STABLE filename —
    # unlike the hashed chunks beside it, its name never changes between builds.
    # With no directive nginx sent only ETag/Last-Modified, so browsers applied
    # heuristic freshness and reused a cached copy WITHOUT revalidating. A remote
    # rebuilt with a new tab or component then stayed invisible until someone
    # happened to hard-refresh. Force revalidation on this one file; the hashed
    # chunks it points at remain immutable and cacheable.
    location = /assets/remoteEntry.js {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }
}