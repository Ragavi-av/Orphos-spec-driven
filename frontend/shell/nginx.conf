server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # index.html is the SPA entry point and has a STABLE filename, while every
    # asset it references is content-hashed. With no directive nginx sent only
    # ETag/Last-Modified, so browsers applied heuristic freshness and reused a
    # cached index.html WITHOUT revalidating — which pins the whole app to the
    # OLD hashed bundles and makes a redeployed shell look unchanged. Force
    # revalidation on the entry document only.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Hashed build assets are immutable: a new build emits a new filename, so
    # these can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Module Federation remotes ──────────────────────────────────────────
    # Each plugin_x remote's browser-relative remoteEntryPath (declared in
    # frontend/shell/vite.config.js's federation `remotes` map, and matching
    # platform-registry-service's PluginManifest.remote_entry_path seed)
    # resolves against THIS origin, so it's proxied here rather than served
    # cross-origin — one location block per remote container.
    # `proxy_pass $upstream` (a variable, not a literal) forwards the request
    # URI UNCHANGED — nginx only auto-strips the matched location prefix when
    # proxy_pass has a literal URI component, which the variable form never
    # does. Each remote container's own nginx serves its files from its root
    # (e.g. /assets/remoteEntry.js, no /remotes/<id>/ prefix), so without the
    # `rewrite ... break` below every request 404s upstream even though the
    # container is healthy and the file genuinely exists there.
    #
    # `set` MUST come before `rewrite ... break` in each block, not after —
    # `break` halts processing of the rest of ngx_http_rewrite_module's
    # directives for this request, and `set` is itself one of that module's
    # directives. A `set` placed after `break` silently never runs, leaving
    # $upstream uninitialised ("using uninitialized \"upstream\" variable" /
    # "invalid URL prefix in \"\"" in the error log, 500 to the client).
    location /remotes/ai-copilot/ {
        set $upstream http://eip-plugin-ai-copilot:80;
        rewrite ^/remotes/ai-copilot/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location /remotes/email-scanner/ {
        set $upstream http://eip-plugin-email-scanner:80;
        rewrite ^/remotes/email-scanner/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location /remotes/doc-ingest/ {
        set $upstream http://eip-plugin-doc-ingest:80;
        rewrite ^/remotes/doc-ingest/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location /remotes/rag-search/ {
        set $upstream http://eip-plugin-rag-search:80;
        rewrite ^/remotes/rag-search/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location /remotes/widgets/ {
        set $upstream http://eip-plugin-widgets:80;
        rewrite ^/remotes/widgets/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location /remotes/decision-log/ {
        set $upstream http://eip-plugin-decision-log:80;
        rewrite ^/remotes/decision-log/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    # ── Per-tenant plugin enforcement (nginx auth_request ≈ ForwardAuth) ─────
    # Realises platform-registry-service's PluginRegistryController#gate as a
    # real access boundary. Before proxying a plugin-owned API, nginx fires an
    # internal subrequest to that plugin's /gate endpoint, forwarding the
    # caller's JWT (Authorization) and tenant (X-Tenant-Id). The gate answers
    # 200 if the plugin is enabled for the tenant, 403 if a platform admin
    # disabled it via Admin → Platform → Plugins — so a disabled plugin's API is
    # no longer reachable with a valid tenant token, it isn't just hidden in the
    # shell nav.
    #
    # Only plugins backed by a DEDICATED service are gated here (email-scanner →
    # mail-insight, doc-ingest → doc-ingest, decision-log → decision-log).
    # ai-copilot and rag-search ride SHARED platform APIs (nl-query / sparql), so
    # gating those routes would break the sibling plugin too; they stay UI-gated
    # (the shell drops their tabs via /api/platform/plugins/active) instead.
    #
    # `set $gate_upstream` + a variable proxy_pass defers DNS to request time via
    # the `resolver` above, so nginx still starts if platform-registry is not up
    # yet (same reason the /remotes/ and /api/ blocks use the variable form). If
    # the gate is unreachable the subrequest 502s and auth_request surfaces 500
    # to the client — FAIL-CLOSED by design: a disabled plugin can never leak
    # while the registry is flapping. The auth subrequest nginx issues is always
    # a bodyless GET, which matches the gate's @GetMapping.
    #
    # NOTE: enforcement lives in this prod reverse proxy only. `vite dev` (see
    # vite.config.js proxy) has no auth_request stage, so gating is a
    # container/prod-time boundary — expected, dev keeps every route open.
    location = /_plugin_gate/email-scanner {
        internal;
        set $gate_upstream http://eip-platform-registry:8093;
        proxy_pass $gate_upstream/api/platform/plugins/email-scanner/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
        proxy_set_header Host $host;
    }
    location = /_plugin_gate/doc-ingest {
        internal;
        set $gate_upstream http://eip-platform-registry:8093;
        proxy_pass $gate_upstream/api/platform/plugins/doc-ingest/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
        proxy_set_header Host $host;
    }
    location = /_plugin_gate/decision-log {
        internal;
        set $gate_upstream http://eip-platform-registry:8093;
        proxy_pass $gate_upstream/api/platform/plugins/decision-log/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
        proxy_set_header Host $host;
    }

    location /api/doc-ingest/ {
        # ForwardAuth: 403 unless doc-ingest is enabled for the caller's tenant.
        auth_request /_plugin_gate/doc-ingest;
        set $upstream http://eip-doc-ingest:8091;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        client_max_body_size 52m;
    }

    # voice-service: browser speech-to-text for Ask Orphos.
    #
    # This upstream is EXPECTED to be down most of the time — the voice
    # containers are created stopped and only a platform admin starts them
    # (Admin → Voice). `set $upstream` + a variable proxy_pass defers DNS to
    # request time, so nginx still starts when the container does not exist;
    # a literal proxy_pass would fail the config check at boot and take the
    # whole shell down with it. A 502 from here is the SPA's "voice is not
    # available" signal and is handled, not surfaced as an error.
    #
    # No auth_request gate: voice is not a plugin, and its per-tenant check is
    # enforced inside voice-service by VoiceFeatureGate against the registry.
    #
    # The timeouts are sized for transcription, not for a normal API call —
    # Whisper on CPU takes appreciably longer than the clip's own duration, and
    # a 30s read timeout would cut off any dictation longer than a sentence.
    location /api/voice/ {
        set $upstream http://eip-voice:8099;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_connect_timeout 5s;
        # Matches spring.servlet.multipart.max-request-size in voice-service.
        client_max_body_size 26m;
    }

    # data-ingestion-service: enterprise data-source connections, mapping
    # configuration, and ingestion job management (Admin → Data & AI).
    # Schema metadata reads against slow enterprise databases can take a
    # while, so allow a generous read timeout.
    location /api/data-ingestion/ {
        set $upstream http://eip-data-ingestion:8096;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    location /api/mail-insight/ {
        # ForwardAuth: 403 unless email-scanner is enabled for the caller's tenant.
        auth_request /_plugin_gate/email-scanner;
        set $upstream http://eip-mail-insight:8092;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Live scans call Microsoft Graph + the LLM, so allow a generous timeout.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 5s;
    }

    location /api/briefing/ {
        set $upstream http://eip-briefing:8084;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # HR + Finance dashboard metrics for DEDICATED tenants (e.g. Zenitus).
    # Hosted by briefing-service alongside /api/briefing/.
    location /api/zenitus/ {
        set $upstream http://eip-briefing:8084;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/nl-query/ {
        set $upstream http://eip-nl-query:8082;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 380s;
        proxy_send_timeout 380s;
        proxy_connect_timeout 5s;
    }

    # Service-to-service only (briefing, doc-ingest, mail-insight call it on the
    # Docker network with X-Internal-Token). Never reachable from the browser —
    # the longer prefix wins over /api/nl-query/ above.
    location /api/nl-query/internal/ {
        return 404;
    }

    location /api/mobile/ {
        set $upstream http://eip-mobile-bff:8097;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Captures upload their bytes (camera photos exceed nginx's 1m default), and
        # /captures/extract waits on OCR plus an AI summary from a local model.
        client_max_body_size 20m;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Web dashboard BFF — one call per screen instead of the shell's per-panel fan-out.
    # Read timeout comfortably above the service's own 8s fan-out budget, so a slow
    # screen returns a partial aggregate rather than being cut off at the proxy.
    location /api/web/ {
        set $upstream http://eip-web-bff:8098;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/priority/ {
        set $upstream http://eip-priority-engine:8083;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/sparql {
        set $upstream http://eip-graph-proxy:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/decisions {
        # ForwardAuth: 403 unless decision-log is enabled for the caller's tenant.
        # NB: the widgets dashboard also reads /api/decisions for its decisions
        # tile, so disabling decision-log for a tenant also blanks that tile
        # (it fails gracefully) — intended: no decision-log ⇒ no decision data.
        auth_request /_plugin_gate/decision-log;
        set $upstream http://eip-decision-log:8086;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/alerts {
        set $upstream http://eip-notification:8087;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/agents {
        set $upstream http://eip-agents:8085;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # admin-service was split into three services (see the admin-service
    # decomposition in the modularization plan):
    #   platform-core-service (8090)  — tenant lifecycle/discovery, auth/authz
    #                                   config, onboarding, ops
    #   admin-console-service (8094)  — branding, email, query history
    #   widgets-service        (8095) — dashboard widget layout
    # nginx picks the LONGEST matching prefix location regardless of the
    # order they're declared in, so the more specific /api/admin/branding/,
    # /api/admin/email/, /api/admin/query-history/, and
    # /api/admin/dashboard/layout/ blocks below correctly win over the
    # generic /api/admin/ catch-all even though that's declared first.

    # platform-core-service:
    #   /api/public/tenants/...  — unauthenticated tenant lookup (SPA bootstrap)
    #   /api/auth/...            — self-managed login/register/forgot + SSO callbacks
    #   /api/admin/...           — admin UI calls for tenant/auth/onboarding/ops
    #   /api/dashboard/widgets, /api/dashboard/metrics/... — data-onboarded widgets
    #   /api/internal/...        — service-to-service discovery (NOT exposed to
    #                              the browser — DO NOT add a location for it)
    location /api/public/ {
        set $upstream http://eip-platform-core:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # platform-registry-service: plugin manifests + per-tenant feature flags
    # (PluginRegistry.jsx's /api/platform/plugins/active, PluginsTab.jsx's
    # /api/platform/plugins + /{id}/tenants/{id}/enabled). Without this block
    # the request falls through to the SPA catch-all below and gets back
    # index.html (200, text/html) instead of JSON — axios doesn't parse that
    # as JSON, so callers see a raw HTML string where an array was expected.
    location /api/platform/ {
        set $upstream http://eip-platform-registry:8093;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # agent-orchestrator-service (container eip-agents:8085): the approval-inbox
    # proxy (/api/orchestrator/approvals) and the HTTP event ingress
    # (/api/orchestrator/events). Approve/execute can take a moment (the write
    # tool runs), so the read timeout is generous.
    location /api/orchestrator/ {
        set $upstream http://eip-agents:8085;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 190s;
        proxy_connect_timeout 5s;
    }

    location /api/auth/ {
        set $upstream http://eip-platform-core:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # RBAC access map read by the SPA dashboard (any authenticated tenant user)
    # to decide which sections a role may see. Served by platform-core.
    location /api/access/ {
        set $upstream http://eip-platform-core:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Role aliases (tenant-scoped display names, any authenticated tenant user)
    # so role labels render consistently across the SPA. Served by platform-core.
    location /api/roles/ {
        set $upstream http://eip-platform-core:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/admin/ {
        set $upstream http://eip-platform-core:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # admin-console-service: more specific than /api/admin/ above, so nginx's
    # longest-prefix match routes these here instead of platform-core-service.
    location /api/admin/branding/ {
        set $upstream http://eip-admin-console:8094;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/admin/email/ {
        set $upstream http://eip-admin-console:8094;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # NOTE: no trailing slash — the endpoint is the bare path
    # /api/admin/query-history (AdminQueryHistoryController @GetMapping at root),
    # and the SPA calls it without a trailing slash. A "…/history/" location
    # would not match the slash-less request, so it would fall through to the
    # generic /api/admin/ block and misroute to platform-core-service (404).
    # This prefix is still longer than /api/admin/, so longest-match wins.
    location /api/admin/query-history {
        set $upstream http://eip-admin-console:8094;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Event-communication framework (Communications → Event Alerts tab).
    location /api/admin/events/ {
        set $upstream http://eip-admin-console:8094;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # /api/branding/public/...  — unauthenticated branding (logo/theme for SPA shell)
    location /api/branding/ {
        set $upstream http://eip-admin-console:8094;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/notifications/prefs/ {
        set $upstream http://eip-admin-console:8094;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # The tenant's FX rate table, maintained by admins and read by the converter
    # that restates widget values in the currency a reader picked. Same
    # longest-prefix reasoning as the layout route below.
    location /api/admin/fx-rates {
        set $upstream http://eip-widgets:8095;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # widgets-service: more specific than /api/admin/ and /api/dashboard/, so
    # nginx's longest-prefix match routes these here.
    location /api/admin/dashboard/layout/ {
        set $upstream http://eip-widgets:8095;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # GET /api/dashboard/persona-metrics/{widgetKey} — values for ontology-declared
    # widgets, read from GovMetricObservation and persona-filtered. Must be listed
    # explicitly: /api/dashboard/ below is a catch-all to platform-core, and without
    # this more-specific prefix these calls would 404 there.
    location /api/dashboard/persona-metrics/ {
        set $upstream http://eip-widgets:8095;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # GET/PUT /api/dashboard/layout/me — per-user widget selection + order.
    location /api/dashboard/layout/ {
        set $upstream http://eip-widgets:8095;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # platform-core-service: catch-all for the rest of /api/dashboard/ —
    # GET /api/dashboard/widgets + /api/dashboard/metrics/{id} (data-onboarded
    # widgets, served by onboarding/controller/DashboardWidgetsController).
    location /api/dashboard/ {
        set $upstream http://eip-platform-core:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
