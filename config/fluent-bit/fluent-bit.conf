[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off

# Receives records from the Docker `fluentd` log driver (every EIP container is
# configured with logging.driver=fluentd → fluentd-address localhost:24224).
[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

# Docker sends container_name as "/eip-admin"; strip the leading slash and
# expose it as `container` — the stream field AdminLogsController filters on.
[FILTER]
    Name         lua
    Match        *
    call         norm
    code         function norm(tag,ts,rec) local c=rec["container_name"]; if c then rec["container"]=string.gsub(c,"^/","") end; return 2,ts,rec end

# Ship to VictoriaLogs JSON-stream ingestion. `container` becomes a stream
# field; the Docker `log` field is the message; the record time is the log time.
[OUTPUT]
    Name         http
    Match        *
    Host         eip-victoria-logs
    Port         9428
    URI          /insert/jsonline?_stream_fields=container&_msg_field=log&_time_field=fb_time
    Format       json_lines
    Header       Content-Type application/stream+json
    json_date_key fb_time
    json_date_format iso8601
