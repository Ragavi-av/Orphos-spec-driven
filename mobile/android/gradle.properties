# Build the Android app with JDK 21 (system default is JDK 25, which the Android
# Gradle Plugin does not support). Do not point this at JDK 25.
org.gradle.java.home=C:/Users/Hp/.vscode/extensions/redhat.java-1.56.0-win32-x64/jre/21.0.12.1-win32-x86_64

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# We compile against API 36 (the only platform installed on this machine).
# Suppress the "compileSdk not tested with this AGP" warning.
android.suppressUnsupportedCompileSdk=36

# Executive "Busy" status threshold. The Home header shows "Busy" (red) when the
# number of open tasks in hand exceeds this number, otherwise "Free" (green).
# Configurable per environment; overridable at runtime via AppConfig.
orphos.busyTaskThreshold=3

# Whether HIGH-priority items are shown as mobile alerts (true) or only CRITICAL
# items count as alerts (false). Overridable at runtime via AppConfig.
orphos.alertsIncludeHigh=false
