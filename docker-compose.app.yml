      - EIP_SECURITY_PLATFORM_ISSUER=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/platform
      - INFISICAL_HOST=http://eip-infisical:8080
      - INFISICAL_PROJECT_ID_FILE=/run/infisical/project-id
