      # application.yml secrets.bindings. No direct env injection here.

  # ── Modular Agents & MCP tool servers (design docs/EIP-Agents-MCP-Modular-Design) ──
  # Hot-pluggable Tier-3 plugins: each self-registers with platform-registry at
  # startup and is independently deployable. The control plane runs fine with
  # zero of these present (invariant I5). Removing any one leaves the stack valid.

  # MCP tool server wrapping priority-engine (priority.get_queue/get_sla/get_alerts).
  mcp-priority:
    build: ./mcp/eip-mcp-priority
    image: eip-mcp-priority
    container_name: eip-mcp-priority
    logging: *flog
    ports: ["8101:8080"]
    volumes:
      - infisical_svc:/run/infisical:ro
      - eip_connections:/run/eip:ro
    mem_limit: 256m
    networks: [eip-net]
    restart: unless-stopped
    depends_on:
      platform-registry:
        condition: service_healthy
    environment:
      - EIP_REGISTRY_URL=http://eip-platform-registry:8093
      - EIP_PRIORITY_ENGINE_URL=http://eip-priority-engine:8083
      - INFISICAL_HOST=http://eip-infisical:8080
      - INFISICAL_PROJECT_ID_FILE=/run/infisical/project-id
      - INFISICAL_CLIENT_ID_FILE=/run/infisical/client-id
      - INFISICAL_CLIENT_SECRET_FILE=/run/infisical/client-secret
      # internal-service token loaded from Infisical (eip/internal-service#token) — see application.yml.

  # MCP tool server wrapping decision-log (decision.search_decisions + decision.log_decision write).
  mcp-decision:
    build: ./mcp/eip-mcp-decision
    image: eip-mcp-decision
    container_name: eip-mcp-decision
    logging: *flog
    ports: ["8102:8080"]
    volumes:
      - infisical_svc:/run/infisical:ro
      - eip_connections:/run/eip:ro
