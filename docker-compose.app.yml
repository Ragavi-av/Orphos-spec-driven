networks:
  eip-net:
    external: true

# KEYCLOAK_URL points to Keycloak inside the Docker network.
# Services use this to fetch the JWKS endpoint for JWT validation.
# Keycloak brokers Azure Entra ID login — services are Azure-agnostic.

# Route every container's stdout to Fluent Bit via the Docker fluentd
# log driver. async=true so containers never block if Fluent Bit is down;
# Docker dual-logging keeps `docker logs` working locally.
x-fluentd-logging: &flog
  driver: fluentd
  options:
    fluentd-address: "localhost:24224"
    fluentd-async: "true"
    tag: "{{.Name}}"

services:
  # ── secrets-ready boot gate ─────────────────────────────────────────────────
  # One-shot job that verifies every REQUIRED secret is present in Infisical
  # before the app layer starts. platform-core depends_on this
  # (service_completed_successfully); every other service depends_on
  # platform-core (service_healthy), so the whole layer transitively waits for
  # it. This replaces start.sh's sleep-and-poll with a real dependency edge, so
  # a service can never boot with a blank secret and cache the failure (the
  # tenant-creation 401 class of bug). See config/app/secrets-ready.sh.
  secrets-ready:
    image: curlimages/curl:8.10.1
    container_name: eip-secrets-ready
    logging: *flog
    volumes:
      - infisical_svc:/run/infisical:ro
      - ./config/app/secrets-ready.sh:/secrets-ready.sh:ro
    environment:
      INFISICAL_HOST: http://eip-infisical:8080
      INFISICAL_ENV: prod
      # Secrets whose absence DEFINITELY breaks the platform: the Keycloak admin
      # password (tenant realm provisioning — the reported 401) and the ArcadeDB
      # password (every service's datastore). The Fuseki password is intentionally
      # NOT gated by default (only DEDICATED-tenant provisioning needs it) and the
      # internal-service token is omitted (blank = permit-all in dev). Add
      # eip/fuseki-admin#password here if you require dedicated tenants at boot.
      REQUIRED_SECRETS: "eip/keycloak-admin#password,eip/arcadedb#password"
      GATE_TIMEOUT_SECONDS: "180"
    entrypoint: ["sh", "/secrets-ready.sh"]
    networks: [eip-net]
    restart: "no"

  # Data Ingestion Service - enterprise data-source connectivity (JDBC/REST),
  # metadata discovery, source->target mapping, scheduled/on-demand batch load
  # into the tenant's ArcadeDB. Extra JDBC driver jars (MySQL, Oracle, ODBC
  # bridges) can be dropped into the ./drivers host folder without a rebuild.
  data-ingestion:
    build: ./services/data-ingestion-service
    image: eip-data-ingestion
    container_name: eip-data-ingestion
    logging: *flog
    ports: ["8096:8096"]
    volumes:
      - infisical_svc:/run/infisical:ro
      - eip_connections:/run/eip:ro
      # Extra JDBC driver jars (e.g. MySQL, Oracle, ODBC-JDBC bridges) — drop the
      # jar into ./drivers on the host and restart this service; Spring Boot's
      # PropertiesLauncher appends it to the classpath via -Dloader.path=/app/drivers.
      # See drivers/README.md.
      - ./drivers:/app/drivers
    mem_limit: 384m
    networks: [eip-net]
    restart: unless-stopped
    depends_on:
      platform-core:
        condition: service_healthy
    environment:
      - ARCADEDB_URL=${ARCADEDB_URL:-http://eip-arcadedb:2480}
      - ARCADEDB_USER=${ARCADEDB_USER:-root}
      # Direct fallback for the ArcadeDB password. Normally supplied by the
      # Infisical binding in each service's application.yml, but when Infisical
      # is unavailable that binding yields nothing and EVERY ArcadeDB call fails
      # with "403 Basic authentication error" — prompts, live context and usage
      # recording all break. application.yml's ${ARCADEDB_PASSWORD:} reads this,
      # and the Infisical backstop still overrides it when Infisical is healthy.
      - ARCADEDB_PASSWORD=${ARCADEDB_PASSWORD:-}
      - KEYCLOAK_URL=http://eip-keycloak:8080
      - KEYCLOAK_ISSUER_URI=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/${KEYCLOAK_REALM:-eip}
      - EIP_SECURITY_PLATFORM_ISSUER=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/platform
      - EIP_TENANT_DISCOVERY_URL=http://eip-platform-core:8090
      - INFISICAL_HOST=http://eip-infisical:8080
      - INFISICAL_PROJECT_ID_FILE=/run/infisical/project-id
      - INFISICAL_CLIENT_ID_FILE=/run/infisical/client-id
      - INFISICAL_CLIENT_SECRET_FILE=/run/infisical/client-secret
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8096/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  okg-ingest:
    build: ./services/okg-ingest-service
    image: eip-okg-ingest
    container_name: eip-okg-ingest
    logging: *flog
    ports: ["8081:8081"]
    volumes:
      - infisical_svc:/run/infisical:ro
      - eip_connections:/run/eip:ro
    mem_limit: 256m
    networks: [eip-net]
    restart: unless-stopped
    depends_on:
      platform-core:
        condition: service_healthy
      # Kafka lives in docker-compose.infra.yml — cannot be referenced via
      # depends_on here (see the "Startup-order note" on the platform-core
      # block below); start.sh brings up the infra layer first instead.
    environment:
      - ARCADEDB_URL=${ARCADEDB_URL:-http://eip-arcadedb:2480}
      - ARCADEDB_USER=${ARCADEDB_USER:-root}
      # Jira ingestion (or other okg-events producers) — see okg.jira.* / okg.kafka.*
      # in this service's application.yml for connection-config and topic defaults.
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KEYCLOAK_URL=http://eip-keycloak:8080
      # Browser-facing issuer URLs — must match the iss claim in JWTs minted
      # by Keycloak (pinned via KC_HOSTNAME_URL in docker-compose.infra.yml).
      - KEYCLOAK_ISSUER_URI=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/${KEYCLOAK_REALM:-eip}
      - EIP_SECURITY_PLATFORM_ISSUER=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/platform
      - INFISICAL_HOST=http://eip-infisical:8080
      - INFISICAL_PROJECT_ID_FILE=/run/infisical/project-id
      - INFISICAL_CLIENT_ID_FILE=/run/infisical/client-id
      - INFISICAL_CLIENT_SECRET_FILE=/run/infisical/client-secret
      # Service-to-service /api/internal/ token (EIP_SECURITY_TENANT_DISCOVERY_SERVICE_TOKEN)
      # is loaded from Infisical at eip/internal-service#token — see this service's
      # application.yml secrets.bindings. No direct env injection here.

  okg-reasoning:
    build: ./services/okg-reasoning-service
    image: eip-okg-reasoning
    container_name: eip-okg-reasoning
    logging: *flog
    ports: ["8088:8088"]
    volumes:
      - infisical_svc:/run/infisical:ro
      - eip_connections:/run/eip:ro
    mem_limit: 400m
    networks: [eip-net]
    restart: unless-stopped
    depends_on:
      platform-core:
        condition: service_healthy
    environment:
      - ARCADEDB_URL=${ARCADEDB_URL:-http://eip-arcadedb:2480}
      - ARCADEDB_USER=${ARCADEDB_USER:-root}
      - FUSEKI_URL=http://eip-fuseki:3030
      - KEYCLOAK_URL=http://eip-keycloak:8080
      # Browser-facing issuer URLs — must match the iss claim in JWTs minted
      # by Keycloak (pinned via KC_HOSTNAME_URL in docker-compose.infra.yml).
      - KEYCLOAK_ISSUER_URI=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/${KEYCLOAK_REALM:-eip}
      - EIP_SECURITY_PLATFORM_ISSUER=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/platform
      - INFISICAL_HOST=http://eip-infisical:8080
      - INFISICAL_PROJECT_ID_FILE=/run/infisical/project-id
      - INFISICAL_CLIENT_ID_FILE=/run/infisical/client-id
      - INFISICAL_CLIENT_SECRET_FILE=/run/infisical/client-secret
      # Service-to-service /api/internal/ token (EIP_SECURITY_TENANT_DISCOVERY_SERVICE_TOKEN)
      # is loaded from Infisical at eip/internal-service#token — see this service's
      # application.yml secrets.bindings. No direct env injection here.

  graph-proxy:
    build: ./services/graph-proxy-service
    image: eip-graph-proxy
    container_name: eip-graph-proxy
    logging: *flog
    ports: ["8080:8080"]
    volumes:
      - infisical_svc:/run/infisical:ro
      - eip_connections:/run/eip:ro
    mem_limit: 256m
    networks: [eip-net]
    restart: unless-stopped
    depends_on:
      platform-core:
        condition: service_healthy
    environment:
      - ARCADEDB_URL=${ARCADEDB_URL:-http://eip-arcadedb:2480}
      - ARCADEDB_USER=${ARCADEDB_USER:-root}
      - FUSEKI_URL=http://eip-fuseki:3030
      - KEYCLOAK_URL=http://eip-keycloak:8080
      # Browser-facing issuer URLs — must match the iss claim in JWTs minted
      # by Keycloak (pinned via KC_HOSTNAME_URL in docker-compose.infra.yml).
      - KEYCLOAK_ISSUER_URI=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/${KEYCLOAK_REALM:-eip}
      - EIP_SECURITY_PLATFORM_ISSUER=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/platform
      - INFISICAL_HOST=http://eip-infisical:8080
      - INFISICAL_PROJECT_ID_FILE=/run/infisical/project-id
      - INFISICAL_CLIENT_ID_FILE=/run/infisical/client-id
      - INFISICAL_CLIENT_SECRET_FILE=/run/infisical/client-secret
      # Service-to-service /api/internal/ token (EIP_SECURITY_TENANT_DISCOVERY_SERVICE_TOKEN)
      # is loaded from Infisical at eip/internal-service#token — see this service's
      # application.yml secrets.bindings. No direct env injection here.

  nl-query:
    build: ./services/nl-query-service
    image: eip-nl-query
    container_name: eip-nl-query
    logging: *flog
    ports: ["8082:8082"]
    volumes:
      - infisical_svc:/run/infisical:ro
      - eip_connections:/run/eip:ro
    mem_limit: 256m
    networks: [eip-net]
    restart: unless-stopped
    depends_on:
      # nl-query's QdrantIngestionRunner is an ApplicationRunner that polls
      # platform-core-service's /api/internal/active-tenants at boot. Without
      # this gate, on a cold start the runner finds zero tenants and skips
      # ingestion entirely until next restart.
      platform-core:
        condition: service_healthy
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://eip-ollama:11434}
      # qwen2.5:1.5b measured 2.9x faster than granite3.1-dense:2b on the same
      # ~3.1k-token prompt (103s vs 301s): 42.5 vs 22 tok/s prefill and 12 vs
      # 4.8 tok/s generation. Granite remains available via GraniteChatProvider
      # (OLLAMA_GRANITE_MODEL) for anyone who wants its answer quality back, but
      # note OLLAMA_MAX_LOADED_MODELS=1 on this container means switching between
      # the two evicts and reloads.
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      - OLLAMA_ALT_CHAT_MODEL=phi3.5
      # bge-m3: multilingual (incl. Japanese), 1024-dim. Embeds on eip-ollama-hi.
      - OLLAMA_EMBED_MODEL=bge-m3
      # Must be passed explicitly, exactly as doc-ingest and mcp-rag do. Without
      # it this service falls back to the in-compose hostname, which does not
      # resolve in the remote-AI topology — every embedding call then fails and
      # RetrievalFederator silently returns an empty context, so answers are
      # generated with no RAG at all ("0 chunks matched").
      - OLLAMA_EMBED_URL=${OLLAMA_EMBED_URL:-http://eip-ollama-hi:11434}
      - OLLAMA_HI_URL=${OLLAMA_HI_URL:-http://eip-ollama-hi:11434}
      - OLLAMA_HI_CHAT_MODEL=qwen2.5:1.5b
      # Provider-gate model mode: SINGLE shows only the default 'inhouse' provider;
      # MULTIPLE also surfaces the providers whose key is in OLLAMA_EXTRA_MODELS
      # (phi | granite | qwen). Read by InhouseProviderGate — without these the
      # gate defaults to SINGLE and secondary in-house providers never appear.
      - OLLAMA_MODEL_MODE=${OLLAMA_MODEL_MODE:-SINGLE}
      - OLLAMA_EXTRA_MODELS=${OLLAMA_EXTRA_MODELS:-}
      - QDRANT_HOST=eip-qdrant
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - ARCADEDB_URL=${ARCADEDB_URL:-http://eip-arcadedb:2480}
      - ARCADEDB_USER=${ARCADEDB_USER:-root}
      # Direct fallback for the ArcadeDB password. Normally supplied by the
      # Infisical binding in each service's application.yml, but when Infisical
      # is unavailable that binding yields nothing and EVERY ArcadeDB call fails
      # with "403 Basic authentication error" — prompts, live context and usage
      # recording all break. application.yml's ${ARCADEDB_PASSWORD:} reads this,
      # and the Infisical backstop still overrides it when Infisical is healthy.
      - ARCADEDB_PASSWORD=${ARCADEDB_PASSWORD:-}
      - KEYCLOAK_URL=http://eip-keycloak:8080
      # Browser-facing issuer URLs — must match the iss claim in JWTs minted
      # by Keycloak (pinned via KC_HOSTNAME_URL in docker-compose.infra.yml).
      - KEYCLOAK_ISSUER_URI=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/${KEYCLOAK_REALM:-eip}
      - EIP_SECURITY_PLATFORM_ISSUER=http://${EIP_PUBLIC_HOST:-localhost}:8443/realms/platform
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemma-3-27b-it}
      # Quota economy on metered external providers. A question normally costs
      # THREE model calls: scope classifier, the briefing, and the groundedness
      # self-check. Google AI's free tier allows 20 requests/minute, so that is
      # ~6 questions before a 429. Both extra calls are switchable and default
      # ON — set these to false to spend one call per question.
      #   - scope gate: RULE 0 in the briefing prompt still enforces scope, so
      #     dropping the classifier weakens off-topic rejection, not removes it.
      #   - self-check: produces the TrustSignal behind the trust badge, which
      #     the UI no longer renders — so today it is computed and discarded.
      # Passed as SPRING_APPLICATION_JSON rather than two plain env vars: the
      # scope gate is read by @Value, whose relaxed env-var binding for a
      # dashed name (nlquery.scope-gate.enabled) is easy to get subtly wrong and
      # fails SILENTLY back to the default. JSON binds the exact property names.
      - SPRING_APPLICATION_JSON={"nlquery":{"scope-gate":{"enabled":${NLQUERY_SCOPE_GATE_ENABLED:-true}},"trust":{"self-check-enabled":${NLQUERY_TRUST_SELF_CHECK_ENABLED:-true}}}}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-7}
      # Which provider serves a question when the caller names none. Set to
      # 'gemma' to route the copilot at Google AI (fast, off-network) or leave
      # 'inhouse' for the local CPU model. Falls back to 'inhouse' by itself if
      # the chosen provider has no usable API key.
      - NLQUERY_DEFAULT_PROVIDER=${NLQUERY_DEFAULT_PROVIDER:-inhouse}
      - INFISICAL_HOST=http://eip-infisical:8080
      - INFISICAL_PROJECT_ID_FILE=/run/infisical/project-id
      - INFISICAL_CLIENT_ID_FILE=/run/infisical/client-id
      - INFISICAL_CLIENT_SECRET_FILE=/run/infisical/client-secret
      # Service-to-service /api/internal/ token (EIP_SECURITY_TENANT_DISCOVERY_SERVICE_TOKEN)
      # is loaded from Infisical at eip/internal-service#token — see this service's
      # application.yml secrets.bindings. No direct env injection here.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/nl-query/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  priority-engine:
